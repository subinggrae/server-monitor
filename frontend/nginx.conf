server {
    listen 80;
    server_name _;

    root /usr/share/nginx/html;
    index index.html;

    # API 요청은 Backend로 넘깁니다.
    # Frontend와 Backend를 같은 origin으로 맞춰서 CORS 설정이 필요 없게 합니다.
    location /api/ {
        proxy_pass http://manager-api:8080;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_read_timeout 60s;
    }

    # /actuator는 외부에 열지 않습니다.
    # Prometheus는 Docker network 안에서 manager-api:8080을 직접 조회합니다.

    # React Router를 쓰므로 없는 경로는 index.html로 넘깁니다.
    location / {
        try_files $uri $uri/ /index.html;
    }

    location ~* \.(?:js|css|woff2?|png|svg|ico)$ {
        expires 7d;
        add_header Cache-Control "public";
    }
}
