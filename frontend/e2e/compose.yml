# E2E 테스트 전용 구성입니다. 운영과 개발에 쓰지 않습니다.
# Playwright global-setup.ts가 project 이름 monitoring-manager-e2e로 띄우고 내립니다.
#
# 개발용 구성(../../compose.yml)과 겹치지 않게 합니다.
# - container_name을 두지 않고 image에는 :e2e tag를 씁니다.
# - 화면 port 하나만 열고, 개발용 port(8080, 8081, 13306)를 쓰지 않습니다.
#
# 실제 secret 파일을 읽지 않습니다. 아래 비밀번호와 key는 이 구성에서만 쓰는 값입니다.
# DB는 port를 열지 않고 tmpfs에 있어서 실행이 끝나면 사라집니다.

name: monitoring-manager-e2e

services:

  manager-db:
    image: mariadb:11.4
    environment:
      MARIADB_DATABASE: monitoring_manager
      MARIADB_USER: manager
      MARIADB_PASSWORD: e2e-db-password
      MARIADB_RANDOM_ROOT_PASSWORD: "yes"
    tmpfs:
      - /var/lib/mysql
    healthcheck:
      test: ["CMD", "healthcheck.sh", "--connect", "--innodb_initialized"]
      interval: 2s
      timeout: 5s
      retries: 30

  manager-api:
    build:
      context: ../../backend
    image: monitoring-manager-api:e2e
    environment:
      SPRING_DATASOURCE_URL: jdbc:mariadb://manager-db:3306/monitoring_manager
      SPRING_DATASOURCE_USERNAME: manager
      SPRING_DATASOURCE_PASSWORD: e2e-db-password
      APP_SECRET_KEY: e2e-secret-key-used-only-by-e2e-tests-0123456789

      # Bot Token을 비워 Telegram을 부르지 않습니다.
      # 설정이 잘못돼도 밖으로 나가지 않게 외부 주소는 모두 연결할 수 없는 주소로 둡니다.
      TELEGRAM_BOT_TOKEN: ""
      TELEGRAM_API_BASE_URL: http://127.0.0.1:9
      PROMETHEUS_URL: http://127.0.0.1:9
      ALERTMANAGER_URL: http://127.0.0.1:9
      SNMP_EXPORTER_URL: http://127.0.0.1:9
      SNMP_EXPORTER_RELOAD_URL: http://127.0.0.1:9/-/reload
    depends_on:
      manager-db:
        condition: service_healthy
    healthcheck:
      test: ["CMD-SHELL", "curl -fsS http://localhost:8080/actuator/health || exit 1"]
      interval: 2s
      timeout: 5s
      retries: 60
      start_period: 10s

  manager-web:
    build:
      context: ..
    image: monitoring-manager-web:e2e
    ports:
      - "127.0.0.1:${E2E_WEB_PORT:-18081}:80"
    depends_on:
      manager-api:
        condition: service_healthy
