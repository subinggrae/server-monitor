<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1600 900" role="img" aria-labelledby="t d">
  <title id="t">문서 체계</title>
  <desc id="d">README와 AGENTS.md가 진입점이다. 기준 문서인 ARCHITECTURE, DEVELOPMENT, TESTING, WRITING, DESIGN은 현재 상태를 설명하고 코드와 함께 고친다. 변경 기록인 요구사항, 계획, ADR은 docs/templates의 형식으로 작업마다 추가하며, 계획은 작업이 끝나면 지운다.</desc>
  <style>
    text { font-family: Pretendard, "Apple SD Gothic Neo", "Malgun Gothic", "Noto Sans KR", sans-serif; fill: #1B1F27; }
    .kicker { font-size: 22px; font-weight: 700; fill: #2F5BEA; }
    .title { font-size: 40px; font-weight: 700; }
    .sub { font-size: 24px; fill: #5B6472; }
    .ghead { font-size: 26px; font-weight: 700; }
    .gcap { font-size: 22px; fill: #5B6472; }
    .name { font-size: 24px; font-weight: 700; }
    .name-key { font-size: 24px; font-weight: 700; fill: #2F5BEA; }
    .desc { font-size: 22px; fill: #5B6472; }
    .elabel { font-size: 22px; fill: #5B6472; }
    .group { fill: #F4F6F8; }
    .box { fill: #FFFFFF; stroke: #D7DCE3; stroke-width: 2; }
    .box-key { fill: #EAF0FF; stroke: #2F5BEA; stroke-width: 3; }
    .box-temp { fill: #FFFFFF; stroke: #A9B1BD; stroke-width: 2; stroke-dasharray: 8 6; }
    .edge { stroke: #8A93A3; stroke-width: 2; fill: none; }
  </style>
  <defs>
    <marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M0 0 L10 5 L0 10 z" fill="#8A93A3"/>
    </marker>
  </defs>

  <rect x="1" y="1" width="1598" height="898" rx="24" fill="#FFFFFF" stroke="#E4E7EC" stroke-width="2"/>

  <!-- 제목 -->
  <text class="kicker" x="64" y="96">문서 체계</text>
  <text class="title" x="64" y="148">README에서 출발해 기준 문서와 변경 기록으로 나뉜다</text>
  <text class="sub" x="64" y="192">기준 문서는 지금의 상태를, 변경 기록은 무엇을 왜 바꿨는지를 남긴다.</text>

  <!-- 진입 -->
  <g id="entry">
    <rect class="group" x="64" y="240" width="336" height="568" rx="16"/>
    <text class="ghead" x="88" y="288">진입</text>
    <text class="gcap" x="88" y="320">모두 · 처음 읽는다</text>
    <g class="node"><rect class="box-key" x="88" y="352" width="288" height="72" rx="12"/><text class="name-key" x="112" y="384">README.md</text><text class="desc" x="112" y="412">무엇인가 · 시작하기</text></g>
    <g class="node"><rect class="box" x="88" y="440" width="288" height="72" rx="12"/><text class="name" x="112" y="472">AGENTS.md</text><text class="desc" x="112" y="500">AI 작업 방식</text></g>
  </g>

  <path class="edge" d="M376 388 H442" marker-end="url(#arrow)"/>
  <path class="edge" d="M376 476 H442" marker-end="url(#arrow)"/>

  <!-- 기준 문서 -->
  <g id="reference">
    <rect class="group" x="448" y="240" width="480" height="568" rx="16"/>
    <text class="ghead" x="472" y="288">기준 문서</text>
    <text class="gcap" x="472" y="320">현재 상태 · 코드와 함께 고친다</text>
    <g class="node"><rect class="box" x="472" y="352" width="432" height="72" rx="12"/><text class="name" x="496" y="384">docs/ARCHITECTURE.md</text><text class="desc" x="496" y="412">구조와 코드 위치</text></g>
    <g class="node"><rect class="box" x="472" y="440" width="432" height="72" rx="12"/><text class="name" x="496" y="472">docs/DEVELOPMENT.md</text><text class="desc" x="496" y="500">실행 · 검증 · 반영</text></g>
    <g class="node"><rect class="box" x="472" y="528" width="432" height="72" rx="12"/><text class="name" x="496" y="560">docs/TESTING.md</text><text class="desc" x="496" y="588">테스트 기준</text></g>
    <g class="node"><rect class="box" x="472" y="616" width="432" height="72" rx="12"/><text class="name" x="496" y="648">docs/WRITING.md</text><text class="desc" x="496" y="676">문서 작성 규칙</text></g>
    <g class="node" id="design-doc"><rect class="box" x="472" y="704" width="432" height="72" rx="12"/><text class="name" x="496" y="736">docs/DESIGN.md</text><text class="desc" x="496" y="764">화면 원칙 · Frontend</text></g>
  </g>

  <!-- 변경 기록 -->
  <g id="records">
    <rect class="group" x="976" y="240" width="560" height="568" rx="16"/>
    <text class="ghead" x="1000" y="288">변경 기록</text>
    <text class="gcap" x="1000" y="320">작업마다 추가 · 승인 후 고정</text>
    <g class="node"><rect class="box" x="1000" y="352" width="512" height="72" rx="12"/><text class="name" x="1024" y="384">docs/templates/</text><text class="desc" x="1024" y="412">요구사항 · 계획 · ADR 형식</text></g>
    <path class="edge" d="M1048 424 V482" marker-end="url(#arrow)"/>
    <text class="elabel" x="1064" y="460">이 형식으로 만든다</text>
    <g class="node"><rect class="box" x="1000" y="488" width="512" height="72" rx="12"/><text class="name" x="1024" y="520">requirements/NNNN-이름.md</text><text class="desc" x="1024" y="548">무엇을 만족해야 하는가</text></g>
    <g class="node"><rect class="box-temp" x="1000" y="576" width="512" height="72" rx="12"/><text class="name" x="1024" y="608">requirements/NNNN-이름.plan.md</text><text class="desc" x="1024" y="636">어떻게 바꿀 것인가 · 끝나면 지운다</text></g>
    <g class="node"><rect class="box" x="1000" y="664" width="512" height="72" rx="12"/><text class="name" x="1024" y="696">decisions/NNNN-이름.md</text><text class="desc" x="1024" y="724">왜 이렇게 결정했는가</text></g>
  </g>
</svg>
