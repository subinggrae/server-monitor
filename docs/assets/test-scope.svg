<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 752 304" width="752" height="304" role="img" aria-labelledby="test-scope-title test-scope-desc">
  <title id="test-scope-title">테스트 종류마다 검사하는 계층의 범위가 다르다</title>
  <desc id="test-scope-desc">열은 화면, API, 도메인 로직, Manager Database 순서의 계층이다. 정적 검사는 코드를 실행하지 않고 모든 계층을 검사한다. 단위 테스트는 도메인 로직만 검사한다. 통합 테스트는 API부터 MariaDB·PostgreSQL까지 실제로 연결해 검사한다. 컴포넌트 테스트는 API 응답을 테스트가 만들어 화면만 검사한다. E2E 테스트는 브라우저로 화면부터 Manager Database까지 연결해 검사한다. 어느 테스트도 Prometheus, exporter, Telegram 같은 외부 시스템에는 연결하지 않는다.</desc>
  <style>
    svg { --paper: #FFFFFF; --ink: #2D3142; --muted: #5C667A; --edge: #8A92A3; --hair: #D9DCE1; --band: #F5F6F8; --accent: #C2410C; --accent-fill: #FFF4EE; }
    @media (prefers-color-scheme: dark) {
      svg { --paper: #0D1117; --ink: #E6EDF3; --muted: #9DA7B3; --edge: #7D8590; --hair: #30363D; --band: #161B22; --accent: #F0883E; --accent-fill: #2B1A10; }
    }
    text { font-family: Pretendard, "Apple SD Gothic Neo", "Malgun Gothic", "Noto Sans KR", sans-serif; fill: var(--ink); }
    .paper { fill: var(--paper); }
    .name { font-size: 14px; font-weight: 600; }
    .sub { font-size: 12px; fill: var(--muted); }
    .band { fill: var(--band); }
    .dot { fill: var(--ink); }
    .range { stroke: var(--ink); stroke-width: 2; stroke-linecap: round; }
    .range-dash { stroke: var(--edge); stroke-width: 2; stroke-dasharray: 2 6; stroke-linecap: round; }
  </style>

  <rect class="paper" width="752" height="304"/>

  <!-- 열 바탕: 둘째와 넷째 열. 열은 x = 160 + 144 × 순서, 폭 144 -->
  <g id="bands">
    <rect class="band" x="304" y="16" width="144" height="272"/>
    <rect class="band" x="592" y="16" width="144" height="272"/>
  </g>

  <!-- 열 이름: 계층 -->
  <g id="columns">
    <text class="sub" x="232" y="36" text-anchor="middle">화면</text>
    <text class="sub" x="376" y="36" text-anchor="middle">API</text>
    <text class="sub" x="520" y="36" text-anchor="middle">도메인 로직</text>
    <text class="sub" x="664" y="36" text-anchor="middle">Manager Database</text>
  </g>

  <!-- 행: 범위 선 y = 72 + 48 × 순서. 행 이름 기준선은 선보다 4 위 -->
  <g id="row-static">
    <text class="name" x="24" y="68">정적 검사</text>
    <text class="sub" x="24" y="88">코드 실행 없음</text>
    <line class="range-dash" x1="184" y1="72" x2="712" y2="72"/>
    <circle class="dot" cx="184" cy="72" r="4"/>
    <circle class="dot" cx="712" cy="72" r="4"/>
  </g>
  <g id="row-unit">
    <text class="name" x="24" y="124">단위</text>
    <line class="range" x1="472" y1="120" x2="568" y2="120"/>
    <circle class="dot" cx="472" cy="120" r="4"/>
    <circle class="dot" cx="568" cy="120" r="4"/>
  </g>
  <g id="row-integration">
    <text class="name" x="24" y="172">통합</text>
    <line class="range" x1="328" y1="168" x2="712" y2="168"/>
    <circle class="dot" cx="328" cy="168" r="4"/>
    <circle class="dot" cx="712" cy="168" r="4"/>
  </g>
  <g id="row-component">
    <text class="name" x="24" y="220">컴포넌트</text>
    <line class="range" x1="184" y1="216" x2="280" y2="216"/>
    <circle class="dot" cx="184" cy="216" r="4"/>
    <circle class="dot" cx="280" cy="216" r="4"/>
  </g>
  <g id="row-e2e">
    <text class="name" x="24" y="268">E2E</text>
    <line class="range" x1="184" y1="264" x2="712" y2="264"/>
    <circle class="dot" cx="184" cy="264" r="4"/>
    <circle class="dot" cx="712" cy="264" r="4"/>
  </g>
</svg>
