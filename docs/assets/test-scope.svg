<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1600 624" role="img" aria-labelledby="t d">
  <title id="t">테스트 종류별로 검증하는 범위</title>
  <desc id="d">정적 검사는 코드 전체를 실행하지 않고 검사한다. 단위 테스트는 분기가 있는 도메인 로직, 통합 테스트는 API부터 MariaDB·PostgreSQL까지 실제로 연결해 검사한다. 화면을 실행해 검사하는 자동 테스트는 없다. 범위가 넓을수록 느리므로 적게 쓴다.</desc>
  <style>
    text { font-family: Pretendard, "Apple SD Gothic Neo", "Malgun Gothic", "Noto Sans KR", sans-serif; fill: #1B1F27; }
    .kicker { font-size: 22px; font-weight: 700; fill: #2F5BEA; }
    .title { font-size: 40px; font-weight: 700; }
    .sub { font-size: 24px; fill: #5B6472; }
    .layer { font-size: 24px; font-weight: 600; text-anchor: middle; }
    .colhead { font-size: 22px; font-weight: 700; fill: #8A93A3; }
    .row { font-size: 26px; font-weight: 700; }
    .cost { font-size: 22px; fill: #5B6472; }
    .lane { fill: #F4F6F8; }
    .bar { fill: #2F5BEA; }
    .bar-t { font-size: 22px; font-weight: 600; fill: #FFFFFF; text-anchor: middle; }
    .bar-static { fill: #FFFFFF; stroke: #A9B1BD; stroke-width: 2; stroke-dasharray: 8 6; }
    .bar-static-t { font-size: 22px; font-weight: 600; fill: #5B6472; text-anchor: middle; }
  </style>

  <rect x="1" y="1" width="1598" height="622" rx="24" fill="#FFFFFF" stroke="#E4E7EC" stroke-width="2"/>

  <!-- 제목 -->
  <text class="kicker" x="64" y="96">테스트 범위</text>
  <text class="title" x="64" y="148">테스트마다 맡는 범위가 다르다. 넓을수록 적게 쓴다</text>
  <text class="sub" x="64" y="192">하나의 동작은 확인할 수 있는 가장 낮은 수준에서 한 번만 검사한다.</text>

  <!-- 시스템 계층 -->
  <g id="layers">
    <rect class="lane" x="288" y="232" width="224" height="328" rx="12"/>
    <rect class="lane" x="520" y="232" width="224" height="328" rx="12"/>
    <rect class="lane" x="752" y="232" width="224" height="328" rx="12"/>
    <rect class="lane" x="984" y="232" width="224" height="328" rx="12"/>
    <text class="layer" x="400" y="276">화면</text>
    <text class="layer" x="632" y="276">API</text>
    <text class="layer" x="864" y="276">도메인 로직</text>
    <text class="layer" x="1096" y="276">DB·외부 시스템</text>
    <text class="colhead" x="1256" y="276">속도 · 양</text>
  </g>

  <!-- 정적 검사 -->
  <g id="row-static">
    <text class="row" x="64" y="369">정적 검사</text>
    <g class="node"><rect class="bar-static" x="296" y="340" width="904" height="40" rx="20"/><text class="bar-static-t" x="748" y="368">코드 전체 · 실행하지 않음</text></g>
    <text class="cost" x="1256" y="368">즉시 · 항상</text>
  </g>

  <!-- 단위 -->
  <g id="row-unit">
    <text class="row" x="64" y="449">단위</text>
    <g class="node"><rect class="bar" x="760" y="420" width="208" height="40" rx="20"/><text class="bar-t" x="864" y="448">분기 있는 로직</text></g>
    <text class="cost" x="1256" y="448">빠름 · 많이</text>
  </g>

  <!-- 통합 -->
  <g id="row-integration">
    <text class="row" x="64" y="529">통합</text>
    <g class="node"><rect class="bar" x="528" y="500" width="672" height="40" rx="20"/><text class="bar-t" x="864" y="528">API부터 DB까지 실제로 연결</text></g>
    <text class="cost" x="1256" y="528">보통 · 기능마다</text>
  </g>
</svg>
