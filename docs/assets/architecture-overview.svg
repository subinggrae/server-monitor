<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 840 320" width="840" height="320" role="img" aria-labelledby="architecture-overview-title architecture-overview-desc">
  <title id="architecture-overview-title">관리자 서버가 감시 대상 목록을 주면 모니터링 시스템이 감시 대상을 확인하고 수집해 장애를 관리자 서버에 보낸다</title>
  <desc id="architecture-overview-desc">모니터링 시스템(Prometheus, Alertmanager, Blackbox Exporter)과 관리자 서버는 따로 배포한다. 관리자 서버는 이 저장소 밖에 있다. Prometheus는 HTTP SD로 관리자 서버에서 감시 대상 목록을 받아, Blackbox Exporter로 감시 대상이 살아 있는지 확인하고 감시 대상 서버의 OS exporter를 직접 수집한다. Prometheus가 판단한 장애는 Alertmanager가 webhook으로 관리자 서버에 보낸다. 관리자 서버는 PromQL로 Prometheus에서 결과를 조회하고, 알림은 관리자 서버가 고른 수단으로 보낸다.</desc>
  <style>
    svg { --paper: #FFFFFF; --ink: #2D3142; --muted: #5C667A; --edge: #8A92A3; --hair: #D9DCE1; --band: #F5F6F8; --accent: #C2410C; --accent-fill: #FFF4EE; }
    @media (prefers-color-scheme: dark) {
      svg { --paper: #0D1117; --ink: #E6EDF3; --muted: #9DA7B3; --edge: #7D8590; --hair: #30363D; --band: #161B22; --accent: #F0883E; --accent-fill: #2B1A10; }
    }
    text { font-family: Pretendard, "Apple SD Gothic Neo", "Malgun Gothic", "Noto Sans KR", sans-serif; fill: var(--ink); }
    .paper { fill: var(--paper); }
    .name { font-size: 14px; font-weight: 600; }
    .sub { font-size: 12px; fill: var(--muted); }
    .mono { font-family: Consolas, Menlo, "D2Coding", monospace; }
    .key { fill: var(--accent); }
    .dim { fill: var(--muted); }
    .box { fill: var(--paper); stroke: var(--ink); stroke-width: 1; }
    .band { fill: var(--band); }
    .edge { stroke: var(--edge); stroke-width: 1; fill: none; }
    .edge-key { stroke: var(--accent); stroke-width: 1.5; fill: none; }
    .arrow { fill: var(--edge); }
    .arrow-key { fill: var(--accent); }
  </style>
  <defs>
    <marker id="architecture-overview-arrow" viewBox="0 0 8 8" refX="7" refY="4" markerWidth="8" markerHeight="8" orient="auto-start-reverse">
      <path class="arrow" d="M0 0 L8 4 L0 8 z"/>
    </marker>
    <marker id="architecture-overview-arrow-key" viewBox="0 0 8 8" refX="7" refY="4" markerWidth="8" markerHeight="8" orient="auto-start-reverse">
      <path class="arrow-key" d="M0 0 L8 4 L0 8 z"/>
    </marker>
  </defs>

  <rect class="paper" width="840" height="320"/>

  <!-- 시스템 경계: 모니터링 시스템(infrastructure/compose.yml) -->
  <g id="boundary">
    <rect class="band" x="216" y="16" width="416" height="288"/>
    <text class="sub" x="232" y="36">모니터링 시스템</text>
  </g>

  <!-- 연결선 -->
  <g id="edges">
    <path class="edge" d="M152 112 H224 Q232 112 232 104 V80 Q232 72 240 72 H256" marker-end="url(#architecture-overview-arrow)"/>
    <path class="edge" d="M256 96 H256 Q248 96 248 104 V128 Q248 136 240 136 H152" marker-end="url(#architecture-overview-arrow)"/>
    <path class="edge-key" d="M256 228 H256 Q248 228 248 220 V168 Q248 160 240 160 H152" marker-end="url(#architecture-overview-arrow-key)"/>
    <path class="edge" d="M332 112 V200" marker-end="url(#architecture-overview-arrow)"/>
    <path class="edge" d="M408 72 H456" marker-end="url(#architecture-overview-arrow)"/>
    <path class="edge" d="M608 84 H672" marker-end="url(#architecture-overview-arrow)"/>
    <path class="edge" d="M408 96 H424 Q432 96 432 104 V220 Q432 228 440 228 H672" marker-end="url(#architecture-overview-arrow)"/>
  </g>

  <!-- 외부 시스템: 관리자 서버(이 시스템을 부르는 쪽) -->
  <g class="node" id="admin-server">
    <rect class="box" x="16" y="108" width="136" height="56" rx="4"/>
    <text class="name dim" x="84" y="140" text-anchor="middle">관리자 서버</text>
  </g>

  <!-- 실행 단위 -->
  <g class="node" id="prometheus">
    <rect class="box" x="256" y="56" width="152" height="56" rx="4"/>
    <text class="name" x="332" y="80" text-anchor="middle">Prometheus</text>
    <text class="sub" x="332" y="100" text-anchor="middle">수집, Alert 평가</text>
  </g>
  <g class="node" id="alertmanager">
    <rect class="box" x="256" y="200" width="152" height="56" rx="4"/>
    <text class="name" x="332" y="224" text-anchor="middle">Alertmanager</text>
    <text class="sub" x="332" y="244" text-anchor="middle">Alert 전달</text>
  </g>
  <g class="node" id="blackbox">
    <rect class="box" x="456" y="56" width="152" height="56" rx="4"/>
    <text class="name" x="532" y="80" text-anchor="middle">Blackbox Exporter</text>
    <text class="sub" x="532" y="100" text-anchor="middle">가용성 확인</text>
  </g>

  <!-- 외부 시스템: 감시 대상 -->
  <g class="node" id="targets">
    <rect class="box" x="672" y="56" width="152" height="56" rx="4"/>
    <text class="name dim" x="748" y="88" text-anchor="middle">감시 대상</text>
  </g>
  <g class="node" id="os-exporter">
    <rect class="box" x="672" y="200" width="152" height="56" rx="4"/>
    <text class="name dim" x="748" y="232" text-anchor="middle">OS exporter</text>
  </g>

  <!-- 연결선 이름 -->
  <g id="edge-labels">
    <text class="sub" x="164" y="100">PromQL</text>
    <text class="sub" x="164" y="124">HTTP SD</text>
    <text class="sub key" x="164" y="148">webhook</text>
    <text class="sub" x="340" y="160">Alert</text>
    <text class="sub" x="432" y="60" text-anchor="middle">probe</text>
    <text class="sub" x="640" y="72" text-anchor="middle">확인</text>
    <text class="sub" x="552" y="216" text-anchor="middle">수집</text>
  </g>
</svg>
