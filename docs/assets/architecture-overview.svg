<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 840 352" width="840" height="352" role="img" aria-labelledby="architecture-overview-title architecture-overview-desc">
  <title id="architecture-overview-title">설정은 Manager Database 하나에 모이고, Prometheus는 manager-api의 SD로 수집 대상을 받는다</title>
  <desc id="architecture-overview-desc">운영자는 브라우저로 manager-web을 열고, manager-web은 /api 요청을 manager-api로 넘긴다. manager-api는 설정을 JDBC로 Manager Database(MariaDB 또는 PostgreSQL)에 저장한다. Prometheus는 manager-api의 HTTP SD로 수집 대상을 받아 Blackbox·SNMP Exporter로 수집하고, Exporter는 모니터링 대상 서버와 서비스에 직접 접근한다. manager-api는 PromQL로 Prometheus에 상태를 묻는다. Prometheus의 Alert는 Alertmanager를 거쳐 manager-api webhook으로 오고, manager-api가 Telegram Bot API로 알림을 보낸다. 모니터링 대상과 Telegram은 이 시스템 밖에 있다.</desc>
  <style>
    svg { --paper: #FFFFFF; --ink: #2D3142; --muted: #5C667A; --edge: #8A92A3; --hair: #D9DCE1; --band: #F5F6F8; --accent: #C2410C; --accent-fill: #FFF4EE; }
    @media (prefers-color-scheme: dark) {
      svg { --paper: #0D1117; --ink: #E6EDF3; --muted: #9DA7B3; --edge: #7D8590; --hair: #30363D; --band: #161B22; --accent: #F0883E; --accent-fill: #2B1A10; }
    }
    text { font-family: Pretendard, "Apple SD Gothic Neo", "Malgun Gothic", "Noto Sans KR", sans-serif; fill: var(--ink); }
    .paper { fill: var(--paper); }
    .name { font-size: 14px; font-weight: 600; }
    .sub { font-size: 12px; fill: var(--muted); }
    .mono { font-family: Consolas, Menlo, "D2Coding", monospace; }
    .key { fill: var(--accent); }
    .dim { fill: var(--muted); }
    .box { fill: var(--paper); stroke: var(--ink); stroke-width: 1; }
    .band { fill: var(--band); }
    .edge { stroke: var(--edge); stroke-width: 1; fill: none; }
    .edge-key { stroke: var(--accent); stroke-width: 1.5; fill: none; }
    .arrow { fill: var(--edge); }
    .arrow-key { fill: var(--accent); }
  </style>
  <defs>
    <marker id="architecture-overview-arrow" viewBox="0 0 8 8" refX="7" refY="4" markerWidth="8" markerHeight="8" orient="auto-start-reverse">
      <path class="arrow" d="M0 0 L8 4 L0 8 z"/>
    </marker>
    <marker id="architecture-overview-arrow-key" viewBox="0 0 8 8" refX="7" refY="4" markerWidth="8" markerHeight="8" orient="auto-start-reverse">
      <path class="arrow-key" d="M0 0 L8 4 L0 8 z"/>
    </marker>
  </defs>

  <rect class="paper" width="840" height="352"/>

  <!-- 시스템 경계: compose.yml이 띄우는 실행 단위 -->
  <g id="boundary">
    <rect class="band" x="120" y="16" width="568" height="320" rx="4"/>
    <text class="sub" x="136" y="40">Monitoring Manager</text>
  </g>

  <!-- 연결선 -->
  <g id="edges">
    <path class="edge" d="M96 92 H144" marker-end="url(#architecture-overview-arrow)"/>
    <path class="edge" d="M280 92 H328" marker-end="url(#architecture-overview-arrow)"/>
    <path class="edge" d="M464 80 H712" marker-end="url(#architecture-overview-arrow)"/>
    <path class="edge" d="M464 108 H580 Q588 108 588 116 V160" marker-end="url(#architecture-overview-arrow)"/>
    <path class="edge" d="M280 188 H336 Q344 188 344 180 V120" marker-end="url(#architecture-overview-arrow)"/>
    <path class="edge" d="M328 284 H220 Q212 284 212 276 V216" marker-end="url(#architecture-overview-arrow)"/>
    <path class="edge-key" d="M384 256 V120" marker-end="url(#architecture-overview-arrow-key)"/>
    <path class="edge" d="M448 120 V256" marker-end="url(#architecture-overview-arrow)"/>
    <path class="edge" d="M464 284 H512" marker-end="url(#architecture-overview-arrow)"/>
    <path class="edge" d="M664 284 H712" marker-end="url(#architecture-overview-arrow)"/>
  </g>

  <!-- 연결선 이름 -->
  <g id="edge-labels">
    <text class="sub" x="120" y="80" text-anchor="middle">HTTP</text>
    <text class="sub mono" x="304" y="80" text-anchor="middle">/api</text>
    <text class="sub" x="588" y="68" text-anchor="middle">알림 전송</text>
    <text class="sub" x="596" y="140">JDBC</text>
    <text class="sub" x="312" y="176" text-anchor="middle">webhook</text>
    <text class="sub" x="272" y="272" text-anchor="middle">Alert</text>
    <text class="sub key" x="392" y="172">HTTP SD</text>
    <text class="sub" x="456" y="240">PromQL</text>
    <text class="sub" x="488" y="272" text-anchor="middle">수집</text>
    <text class="sub" x="688" y="272" text-anchor="middle">접근</text>
  </g>

  <!-- 사용자 -->
  <g class="node" id="operator">
    <rect class="box" x="16" y="64" width="80" height="56" rx="4"/>
    <text class="name" x="56" y="88" text-anchor="middle">운영자</text>
    <text class="sub" x="56" y="108" text-anchor="middle">브라우저</text>
  </g>

  <!-- 실행 단위 -->
  <g class="node" id="manager-web">
    <rect class="box" x="144" y="64" width="136" height="56" rx="4"/>
    <text class="name mono" x="212" y="88" text-anchor="middle">manager-web</text>
    <text class="sub" x="212" y="108" text-anchor="middle">React, Nginx</text>
  </g>
  <g class="node" id="manager-api">
    <rect class="box" x="328" y="64" width="136" height="56" rx="4"/>
    <text class="name mono" x="396" y="88" text-anchor="middle">manager-api</text>
    <text class="sub" x="396" y="108" text-anchor="middle">Spring Boot</text>
  </g>
  <g class="node" id="manager-db">
    <rect class="box" x="512" y="160" width="152" height="56" rx="4"/>
    <text class="name" x="588" y="184" text-anchor="middle">Manager DB</text>
    <text class="sub" x="588" y="204" text-anchor="middle">MariaDB, PostgreSQL</text>
  </g>
  <g class="node" id="alertmanager">
    <rect class="box" x="144" y="160" width="136" height="56" rx="4"/>
    <text class="name" x="212" y="184" text-anchor="middle">Alertmanager</text>
    <text class="sub" x="212" y="204" text-anchor="middle">Alert 묶기</text>
  </g>
  <g class="node" id="prometheus">
    <rect class="box" x="328" y="256" width="136" height="56" rx="4"/>
    <text class="name" x="396" y="280" text-anchor="middle">Prometheus</text>
    <text class="sub" x="396" y="300" text-anchor="middle">수집, Alert 평가</text>
  </g>
  <g class="node" id="exporter">
    <rect class="box" x="512" y="256" width="152" height="56" rx="4"/>
    <text class="name" x="588" y="280" text-anchor="middle">Exporter</text>
    <text class="sub" x="588" y="300" text-anchor="middle">Blackbox, SNMP</text>
  </g>

  <!-- 외부 시스템 -->
  <g class="node" id="telegram">
    <rect class="box" x="712" y="64" width="112" height="56" rx="4"/>
    <text class="name dim" x="768" y="88" text-anchor="middle">Telegram</text>
    <text class="sub" x="768" y="108" text-anchor="middle">Bot API</text>
  </g>
  <g class="node" id="targets">
    <rect class="box" x="712" y="256" width="112" height="56" rx="4"/>
    <text class="name dim" x="768" y="280" text-anchor="middle">모니터링 대상</text>
    <text class="sub" x="768" y="300" text-anchor="middle">서버, 서비스</text>
  </g>
</svg>
