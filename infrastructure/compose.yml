# 모니터링 코어(Prometheus, Blackbox Exporter, Alertmanager)입니다. 앱보다 먼저 띄웁니다.
#
#   cp infrastructure/.env.example infrastructure/.env
#   core-dev.bat start      (Windows. 직접 실행하면 docker compose -f infrastructure/compose.yml up -d --build)
#
# 설정과 규칙은 이미지에 들어 있습니다. 바꾸면 이미지를 다시 빌드해 띄웁니다. (docs/decisions/0009)
# 기록 보관 기간·용량, 확인 제한 시간, 호스트 포트는 다시 빌드하지 않고 .env에서 바꿉니다. 이름과 허용 범위는 .env.example에 있습니다.
# 호스트 포트는 바꿔도 127.0.0.1에만 열리고, 컨테이너 안 포트(관리자 서버와 코어끼리 부르는 포트)는 바뀌지 않습니다.
# 내부망 서버용 실행 파일은 scripts/build-core-bundle.mjs가 이 파일에서 build 항목과 token 폴더 기본값만 바꿔 만듭니다.
#
# 앱 없이 띄우면 감시 대상 없이 떠 있다가, 앱이 뜨면 다음 HTTP SD 갱신 때 대상을 받습니다.
# 앱은 이 파일이 만드는 monitoring 네트워크에 붙습니다. 코어와 앱의 약속은 docs/INTEGRATION.md에 있습니다.

name: monitoring-core

# 이미지의 render-config.sh가 컨테이너 환경 변수를 검사해 설정 템플릿에 펼친 뒤 원래 프로세스를 실행합니다.
# 서비스의 environment 안에서 <<:로 합치고, 그 서비스만 쓰는 값을 더합니다.
x-app-address: &app-address
  MONITORING_APP_ADDRESS: ${MONITORING_APP_ADDRESS:?MONITORING_APP_ADDRESS가 필요합니다. infrastructure/.env.example을 참고해 주세요.}

x-core-build-args: &core-build-args
  CORE_VERSION: ${CORE_VERSION:-dev}
  CORE_REVISION: ${CORE_REVISION:-unknown}
  CORE_COMMIT_TIME: ${CORE_COMMIT_TIME:-0}

services:

  blackbox-exporter:
    build:
      context: .
      dockerfile: blackbox/Dockerfile
      args: *core-build-args
    image: monitoring-core-blackbox-exporter:${CORE_VERSION:-dev}
    container_name: blackbox-exporter
    restart: unless-stopped

    environment:
      CORE_PROBE_TIMEOUT_SECONDS: ${CORE_PROBE_TIMEOUT_SECONDS:-}

    ports:
      - "127.0.0.1:${CORE_BLACKBOX_PORT:-9115}:9115"

    healthcheck:
      test: ["CMD", "wget", "-q", "-O", "/dev/null", "http://localhost:9115/-/healthy"]
      interval: 15s
      timeout: 5s
      retries: 5

    networks:
      - monitoring

  prometheus:
    build:
      context: .
      dockerfile: prometheus/Dockerfile
      args: *core-build-args
    image: monitoring-core-prometheus:${CORE_VERSION:-dev}
    container_name: prometheus
    restart: unless-stopped

    environment:
      <<: *app-address
      CORE_RETENTION_DAYS: ${CORE_RETENTION_DAYS:-}
      CORE_RETENTION_SIZE_GB: ${CORE_RETENTION_SIZE_GB:-}

    ports:
      - "127.0.0.1:${CORE_PROMETHEUS_PORT:-9090}:9090"

    volumes:
      - prometheus-data:/prometheus

    healthcheck:
      test: ["CMD", "wget", "-q", "-O", "/dev/null", "http://localhost:9090/-/ready"]
      interval: 15s
      timeout: 5s
      retries: 5

    networks:
      - monitoring

  alertmanager:
    build:
      context: .
      dockerfile: alertmanager/Dockerfile
      args: *core-build-args
    image: monitoring-core-alertmanager:${CORE_VERSION:-dev}
    container_name: alertmanager
    restart: unless-stopped

    environment:
      <<: *app-address

    ports:
      - "127.0.0.1:${CORE_ALERTMANAGER_PORT:-9093}:9093"

    volumes:
      - alertmanager-data:/alertmanager

    # Telegram 전송은 앱이 맡으므로 Alertmanager는 Bot Token을 받지 않습니다.
    secrets:
      - alertmanager_webhook_token

    healthcheck:
      test: ["CMD", "wget", "-q", "-O", "/dev/null", "http://localhost:9093/-/ready"]
      interval: 15s
      timeout: 5s
      retries: 5

    networks:
      - monitoring

# 앱도 같은 파일을 읽으므로 두 쪽 token이 어긋나지 않습니다. 이 파일은 Git에 올리지 않습니다.
# CORE_SECRETS_DIR로 폴더를 바꿀 수 있습니다. 내부망 서버용 묶음은 기본값이 설치 폴더의 secrets/(../secrets)입니다.
secrets:

  alertmanager_webhook_token:
    file: ${CORE_SECRETS_DIR:-./secrets}/alertmanager_webhook_token

networks:

  monitoring:
    name: monitoring

volumes:

  prometheus-data:
    name: prometheus-data

  alertmanager-data:
    name: alertmanager-data
