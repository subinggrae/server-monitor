# 모니터링 코어(Prometheus, Blackbox Exporter, Alertmanager)입니다. 앱보다 먼저 띄웁니다.
#
#   cp infrastructure/.env.example infrastructure/.env
#   docker compose -f infrastructure/compose.yml up -d
#
# 앱 없이 띄우면 감시 대상 없이 떠 있다가, 앱이 뜨면 다음 HTTP SD 갱신 때 대상을 받습니다.
# 앱은 이 파일이 만드는 monitoring 네트워크에 붙습니다. 코어와 앱의 약속은 docs/INTEGRATION.md에 있습니다.

name: monitoring-core

x-render-config: &render-config
  # 앱 주소를 설정 템플릿에 펼친 뒤 원래 프로세스를 실행합니다.
  environment:
    MONITORING_APP_ADDRESS: ${MONITORING_APP_ADDRESS:?MONITORING_APP_ADDRESS가 필요합니다. infrastructure/.env.example을 참고해 주세요.}

services:

  blackbox-exporter:
    image: quay.io/prometheus/blackbox-exporter:v0.28.0
    container_name: blackbox-exporter
    restart: unless-stopped

    ports:
      - "127.0.0.1:9115:9115"

    volumes:
      - ./blackbox/blackbox.yml:/config/blackbox.yml:ro

    command:
      - --config.file=/config/blackbox.yml

    healthcheck:
      test: ["CMD", "wget", "-q", "-O", "/dev/null", "http://localhost:9115/-/healthy"]
      interval: 15s
      timeout: 5s
      retries: 5

    networks:
      - monitoring

  prometheus:
    <<: *render-config
    image: quay.io/prometheus/prometheus:v3.14.0
    container_name: prometheus
    restart: unless-stopped

    ports:
      - "127.0.0.1:9090:9090"

    volumes:
      - ./render-config.sh:/etc/core/render-config.sh:ro
      - ./prometheus/prometheus.yml:/etc/prometheus/prometheus.yml.template:ro
      - ./prometheus/rules:/etc/prometheus/rules:ro
      - prometheus-data:/prometheus

    entrypoint:
      - /bin/sh
      - /etc/core/render-config.sh
      - /etc/prometheus/prometheus.yml.template
      - /tmp/prometheus.yml
      - /bin/prometheus

    command:
      - --config.file=/tmp/prometheus.yml
      - --storage.tsdb.path=/prometheus
      - --storage.tsdb.retention.time=15d

    healthcheck:
      test: ["CMD", "wget", "-q", "-O", "/dev/null", "http://localhost:9090/-/ready"]
      interval: 15s
      timeout: 5s
      retries: 5

    networks:
      - monitoring

  alertmanager:
    <<: *render-config
    image: quay.io/prometheus/alertmanager:v0.34.1
    container_name: alertmanager
    restart: unless-stopped

    ports:
      - "127.0.0.1:9093:9093"

    volumes:
      - ./render-config.sh:/etc/core/render-config.sh:ro
      - ./alertmanager/alertmanager.yml:/etc/alertmanager/alertmanager.yml.template:ro
      - alertmanager-data:/alertmanager

    # Telegram 전송은 앱이 맡으므로 Alertmanager는 Bot Token을 받지 않습니다.
    secrets:
      - alertmanager_webhook_token

    entrypoint:
      - /bin/sh
      - /etc/core/render-config.sh
      - /etc/alertmanager/alertmanager.yml.template
      - /tmp/alertmanager.yml
      - /bin/alertmanager

    command:
      - --config.file=/tmp/alertmanager.yml
      - --storage.path=/alertmanager
      - --enable-feature=utf8-strict-mode

    healthcheck:
      test: ["CMD", "wget", "-q", "-O", "/dev/null", "http://localhost:9093/-/ready"]
      interval: 15s
      timeout: 5s
      retries: 5

    networks:
      - monitoring

# 앱도 같은 파일을 읽으므로 두 쪽 token이 어긋나지 않습니다. 이 파일은 Git에 올리지 않습니다.
secrets:

  alertmanager_webhook_token:
    file: ./secrets/alertmanager_webhook_token

networks:

  monitoring:
    name: monitoring

volumes:

  prometheus-data:
    name: prometheus-data

  alertmanager-data:
    name: alertmanager-data
