# 모니터링 코어(Prometheus, Blackbox Exporter, Alertmanager)입니다. 앱보다 먼저 띄웁니다.
#
#   cp infrastructure/.env.example infrastructure/.env
#   core-dev.bat start      (Windows. 설정을 펼친 뒤 다시 빌드해 띄웁니다)
#
# Windows가 아니면 OS의 CA 인증서 파일을 certs/에 복사하고 설정을 펼친 뒤 띄웁니다.
#   mkdir -p infrastructure/certs && cp -L /etc/ssl/certs/ca-certificates.crt infrastructure/certs/
#   sh infrastructure/core-server.sh render && docker compose -f infrastructure/compose.yml up -d --build
#
# 코어 이미지에는 실행 파일과 Alert 규칙만 있고 셸이 없습니다. (docs/decisions/0012)
# 설정은 운영 명령(core-server.sh render)이 .env의 값을 검사해 rendered/에 펼치고, 이 파일이 읽기 전용으로 붙입니다.
# 기록 보관 기간·용량, 확인 제한 시간, 호스트 포트는 다시 빌드하지 않고 .env에서 바꿉니다. 이름과 허용 범위는 .env.example에 있습니다.
# .env를 바꾸면 다시 펼친 뒤 띄웁니다. 펼친 설정 파일은 펼칠 때마다 다시 만들므로 고치지 않습니다.
# 호스트 포트는 바꿔도 127.0.0.1에만 열리고, 컨테이너 안 포트(관리자 서버와 코어끼리 부르는 포트)는 바뀌지 않습니다.
# 내부망 서버용 실행 파일은 scripts/build-core-bundle.mjs가 이 파일에서 build 항목과 token 폴더 기본값만 바꿔 만듭니다.
#
# 앱 없이 띄우면 감시 대상 없이 떠 있다가, 앱이 뜨면 다음 HTTP SD 갱신 때 대상을 받습니다.
# 앱은 이 파일이 만드는 monitoring 네트워크에 붙습니다. 코어와 앱의 약속은 docs/INTEGRATION.md에 있습니다.

name: monitoring-core

# 펼칠 때 운영 명령이 만드는 파일입니다. 검사를 통과한 코어 값과 펼친 설정의 해시가 들어 있습니다.
# 펼친 설정이 없으면 Compose가 컨테이너를 만들기 전에 이 파일이 없다는 오류로 멈춥니다. 그러지 않으면 Docker가
# 붙일 파일 자리에 빈 폴더를 만들고, 프로그램이 그 폴더를 설정으로 읽으려다 멈춥니다.
# 해시가 바뀌면 Compose가 컨테이너를 다시 만들어 새로 펼친 설정을 읽게 합니다.
x-rendered-env: &rendered-env
  - path: rendered/core.env
    required: true

x-core-build-args: &core-build-args
  CORE_VERSION: ${CORE_VERSION:-dev}
  CORE_REVISION: ${CORE_REVISION:-unknown}
  CORE_COMMIT_TIME: ${CORE_COMMIT_TIME:-0}

services:

  blackbox-exporter:
    build:
      context: .
      dockerfile: blackbox/Dockerfile
      args: *core-build-args
    image: monitoring-core-blackbox-exporter:${CORE_VERSION:-dev}
    container_name: blackbox-exporter
    restart: unless-stopped

    env_file: *rendered-env

    ports:
      - "127.0.0.1:${CORE_BLACKBOX_PORT:-9115}:9115"

    # CA 인증서 파일은 HTTPS 확인을 하는 이 컨테이너에만 붙입니다. 운영자가 코어 서버 OS의 파일을 복사해 둔 것입니다.
    # 내부망 서버용 묶음은 설치 폴더의 certs/(../certs)를 씁니다.
    volumes:
      - ./rendered/blackbox.yml:/etc/core/blackbox.yml:ro
      - ./certs/ca-certificates.crt:/etc/ssl/certs/ca-certificates.crt:ro

    networks:
      - monitoring

  prometheus:
    build:
      context: .
      dockerfile: prometheus/Dockerfile
      args: *core-build-args
    image: monitoring-core-prometheus:${CORE_VERSION:-dev}
    container_name: prometheus
    restart: unless-stopped

    env_file: *rendered-env

    ports:
      - "127.0.0.1:${CORE_PROMETHEUS_PORT:-9090}:9090"

    volumes:
      - ./rendered/prometheus.yml:/etc/core/prometheus.yml:ro
      - prometheus-data:/prometheus

    networks:
      - monitoring

  alertmanager:
    build:
      context: .
      dockerfile: alertmanager/Dockerfile
      args: *core-build-args
    image: monitoring-core-alertmanager:${CORE_VERSION:-dev}
    container_name: alertmanager
    restart: unless-stopped

    env_file: *rendered-env

    ports:
      - "127.0.0.1:${CORE_ALERTMANAGER_PORT:-9093}:9093"

    volumes:
      - ./rendered/alertmanager.yml:/etc/core/alertmanager.yml:ro
      - alertmanager-data:/alertmanager

    # Telegram 전송은 앱이 맡으므로 Alertmanager는 Bot Token을 받지 않습니다.
    secrets:
      - alertmanager_webhook_token

    networks:
      - monitoring

# 앱도 같은 파일을 읽으므로 두 쪽 token이 어긋나지 않습니다. 이 파일은 Git에 올리지 않습니다.
# CORE_SECRETS_DIR로 폴더를 바꿀 수 있습니다. 내부망 서버용 묶음은 기본값이 설치 폴더의 secrets/(../secrets)입니다.
secrets:

  alertmanager_webhook_token:
    file: ${CORE_SECRETS_DIR:-./secrets}/alertmanager_webhook_token

networks:

  monitoring:
    name: monitoring

volumes:

  prometheus-data:
    name: prometheus-data

  alertmanager-data:
    name: alertmanager-data
