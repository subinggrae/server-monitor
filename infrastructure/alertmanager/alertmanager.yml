# Alertmanager는 Alert를 관리자 서버로 넘기기만 합니다.
#
#   Prometheus → Alertmanager → 관리자 서버 webhook
#   → 관리자 서버가 자기 DB에서 알림 받을 곳을 찾아, 자기가 고른 수단(메신저, 문자 등)으로 알림
#
# 그래서 이 파일에는 알림 수단의 token, 알림 받을 곳, 받는 곳별 routing이 없습니다.
# 사용자가 알림 받을 곳을 더하거나 바꿔도 이 파일은 그대로입니다.
#
# 이 파일은 템플릿입니다. @MONITORING_APP_ADDRESS@는 운영 명령이 띄우기 전에 모니터링 시스템 설정(infrastructure/.env)의
# 관리자 서버 주소로 바꿉니다. 펼치는 방법은 infrastructure/monitoring-server.sh의 render에 있습니다.

route:
  receiver: manager-webhook

  # 하나의 Check가 주소를 여러 개 가질 수 있습니다.
  # check_id로 묶으면 같은 Check의 주소 여러 개가 한 번에 전달됩니다.
  # 사용자가 바꾸는 값(이름, 환경, 확인 방식, 주소)으로 묶지 않습니다. 값을 바꿀 때 묶음이 갈립니다. (docs/decisions/0010)
  group_by:
    - alertname
    - check_id

  group_wait: 30s
  group_interval: 5m
  # 이어지는 Alert를 group_interval(5분)마다 관리자 서버로 다시 보냅니다. 실제로 알림을 다시
  # 보낼지는 관리자 서버가 Check별 알림 다시 보내는 간격(5~1440분)으로 정합니다.
  # group_interval보다 짧게 둡니다. 같게 두면 다음 시점에 경과 시간이 조금 모자라
  # 한 번씩 건너뛰어 10분마다 보냅니다.
  repeat_interval: 4m

receivers:
  - name: manager-webhook
    webhook_configs:
      - url: 'http://@MONITORING_APP_ADDRESS@/api/integrations/alertmanager/webhook'

        # 복구 Alert도 관리자 서버로 보냅니다. 실제로 복구 알림을 보낼지는 관리자 서버의 Check별 설정이 정합니다.
        send_resolved: true

        # 관리자 서버가 모든 Alert를 기록해야 하므로 건수를 자르지 않습니다.
        max_alerts: 0

        http_config:
          # 같은 network의 다른 container가 가짜 Alert를 보내지 못하게 합니다.
          # 이 파일에 token을 평문으로 적지 않습니다.
          authorization:
            type: Bearer
            credentials_file: '/run/secrets/alertmanager_webhook_token'
