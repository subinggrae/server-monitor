# 개발 환경에서 SNMP 흐름을 확인하려고 두는 테스트 장비입니다.
# snmp-test profile로만 뜹니다. 운영에는 올리지 않습니다.
#
# 아래 community는 이 테스트 container 전용입니다. 지키는 값이 없습니다.
# 실제 장비의 community는 화면에서 입력하고 Manager Database가 암호화해서 보관합니다.

rocommunity test-only-not-a-secret default

sysName     snmp-test-agent
sysLocation Monitoring Manager test
sysContact  test@example.com
