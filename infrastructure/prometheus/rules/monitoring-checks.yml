# 관리자 서버가 관리하는 Check의 Alert 규칙입니다.
#
# 대상은 사용자가 UI에서 등록하고 Prometheus가 HTTP Service Discovery로 받아 갑니다.
# 그래서 이 파일에는 개별 대상이 들어가지 않습니다.
#
# Alert label은 아래 둘과 alertname, severity뿐이고, Alertmanager를 거쳐 관리자 서버 webhook까지 전달됩니다.
# 이름을 바꾸면 관리자 서버가 어떤 Check의 Alert인지 알 수 없게 됩니다.
#
#   check_id  check_target_id
#
# SD label의 check_name, environment, check_type, module, instance는 사용자가 화면에서 바꾸는 값이라
# 두 규칙이 id로만 묶어 뺍니다. Alert label에 남기면 값을 바꿀 때 Alert가 복구됐다가 새 Alert로 다시 생깁니다.
# 그래서 annotation에도 이 값들을 쓸 수 없습니다. 알림의 이름, 환경, 주소는 관리자 서버가 자기 DB에서 채웁니다.
# (docs/decisions/0010)
#
# 장애 판정 기준은 "연속 3번 실패하고 첫 실패 뒤 1분이 지남"입니다. 수집 주기(10~240초)와 관계없이 같고,
# 첫 실패부터 판정까지 max(60초, 주기 × 2)가 걸립니다. 주기는 series label로 남지 않아 규칙이 읽을 수 없으므로,
# for로 기다리지 않고 최근 확인 결과를 길이가 다른 창(70초~900초) 여러 개로 봅니다. (docs/decisions/0015)
# 900초(15분)보다 오래된 확인 결과는 세지 않습니다. 식은 다음 셋을 or로 묶습니다.
#
#   두 id로 묶은 창: 창 안의 결과가 모두 실패이고, 3개 이상이며, 60초보다 오래된 결과가 있습니다.
#   가장 최근 series의 창: 위와 같고, 대상마다 가장 최근에 수집한 series만 봅니다.
#   창 바깥 띠: 창 안의 결과가 모두 실패이고 2개 이상이며, 창 바로 바깥 띠의 가장 최근 결과도 실패입니다.
#
# 셋 다 기준을 채웠을 때만 참이라 판정이 기준보다 이르지 않습니다. 주기나 값을 바꾼 직후에는
# 마지막 성공과 첫 실패가 창 간격보다 가까울 수 있어, 아래 둘이 그 경우를 맡습니다. 그래도 드물게
# 규칙 평가 몇 번 늦을 수 있습니다. 각 조건의 이유는 scripts/monitoring-check-rules.mjs에 있습니다.
#
# 이름, 환경, 확인 방식, 주소를 바꿔 옛 series가 끝나고 새 series가 시작해도 한 대상의 확인 결과로 이어서 셉니다.
# range 함수는 수집한 표본만 세고 stale 표시는 세지 않으므로, 옛 series에 stale 표시가 늦게 쓰여도
# 옛 series의 마지막 성공이 뒤의 실패를 가리지 않습니다.
#
# 마지막 줄은 최근 5분 안에 확인 결과가 있어야 장애로 둡니다. 5분은 가장 긴 수집 주기(240초)보다 길게 잡은 값입니다.
# 그래서 지우거나 끈 대상의 Alert는 마지막 확인 결과가 5분 창에서 빠질 때 복구됩니다.
# 살아난 대상은 성공한 확인 결과가 가장 최근 결과라서 바로 복구됩니다.
#
# for를 쓰지 않으므로 Alert의 시작 시각(Alertmanager의 startsAt)은 장애로 판정한 평가 시각입니다.
# 관리자 서버는 annotation의 판정 기준(judgment_failures, judgment_min_seconds)과 자기가 아는 수집 주기로
# 첫 실패 시각을 추정합니다.
#
# 두 expr는 scripts/monitoring-check-rules.mjs가 만듭니다. 손으로 고치지 말고, 스크립트를 고친 뒤
# node scripts/monitoring-check-rules.mjs를 실행합니다. 빌드 검사(--check)가 스크립트 결과와 같은지,
# annotation의 판정 기준이 스크립트와 같은지 봅니다.
#
# 알림 받을 곳은 관리자 서버의 DB가 정합니다.
# 알림 받을 곳(메신저 방 id, 전화번호 등) 같은 라우팅 정보를 이 파일이나 label에 넣지 않습니다.

