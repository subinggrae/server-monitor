# Monitoring Manager가 관리하는 Check의 Alert 규칙입니다.
#
# 대상은 사용자가 UI에서 등록하고 Prometheus가 HTTP Service Discovery로 받아 갑니다.
# 그래서 이 파일에는 개별 대상이 들어가지 않습니다.
#
# Alert label은 아래 둘과 alertname, severity뿐이고, Alertmanager를 거쳐 Manager Webhook까지 전달됩니다.
# 이름을 바꾸면 Manager가 어떤 Check의 Alert인지 알 수 없게 됩니다.
#
#   check_id  check_target_id
#
# SD label의 check_name, environment, check_type, module, instance는 사용자가 화면에서 바꾸는 값이라
# 두 규칙이 id로만 묶어 뺍니다. Alert label에 남기면 값을 바꿀 때 Alert가 복구됐다가 새 Alert로 다시 생깁니다.
# 그래서 annotation에도 이 값들을 쓸 수 없습니다. 알림의 이름, 환경, 주소는 Manager가 Manager Database에서 채웁니다.
# (docs/decisions/0010)
#
# 값을 바꾸면 옛 series는 바로 stale로 끝나고, 새 series는 새 target의 첫 수집 때 시작합니다.
# 그 사이에도 Alert가 끊기지 않게, or 뒤의 식이 stale 표시를 건너뛰는 최근 5분 안의 마지막 값으로 판단합니다.
# 5분은 가장 긴 수집 주기(240초)보다 길게 잡은 값입니다.
# 그래서 지우거나 끈 대상의 Alert는 마지막 실패 값이 5분 창에서 빠질 때 복구됩니다.
# 지금 값이 있는 대상은 그 값이 두 식에 같이 들어가고, max라서 지금 값이 1이면 어느 쪽도 장애가 아닙니다.
# 그래서 살아난 대상은 바로 복구됩니다. 성공 중에 값을 바꾼 뒤 실패하면 or 앞의 식이 바로 장애로 셉니다.
#
# 알림 대상은 Manager Database가 정합니다.
# Telegram chat id 같은 라우팅 정보를 이 파일이나 label에 넣지 않습니다.

groups:
  - name: monitoring-check-alerts
    rules:
      - alert: MonitoringCheckDown
        expr: |
          max by (check_id, check_target_id) (probe_success{job="manager-blackbox"}) == 0
          or
          max by (check_id, check_target_id) (last_over_time(probe_success{job="manager-blackbox"}[5m])) == 0
        for: 1m
        labels:
          severity: critical
        annotations:
          summary: "주소 확인에 실패했습니다"
          description: "주소 확인이 1분 넘게 실패하고 있습니다."

      # Blackbox Exporter가 내려갔거나 Manager API를 조회하지 못하는 상황입니다.
      - alert: MonitoringCheckProbeFailed
        expr: |
          max by (check_id, check_target_id) (up{job="manager-blackbox"}) == 0
          or
          max by (check_id, check_target_id) (last_over_time(up{job="manager-blackbox"}[5m])) == 0
        for: 1m
        labels:
          severity: critical
        annotations:
          summary: "모니터링 확인 자체가 동작하지 않습니다"
          description: "확인 결과를 1분 넘게 가져오지 못했습니다. Blackbox Exporter 상태를 확인해 주세요."
