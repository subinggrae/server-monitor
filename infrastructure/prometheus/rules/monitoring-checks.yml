# Monitoring Manager가 관리하는 Check의 Alert 규칙입니다.
#
# 대상은 사용자가 UI에서 등록하고 Prometheus가 HTTP Service Discovery로 받아 갑니다.
# 그래서 이 파일에는 개별 대상이 들어가지 않습니다.
#
# 아래 label은 Alertmanager를 거쳐 Manager Webhook까지 전달됩니다.
# 이름을 바꾸면 Manager가 어떤 Check의 Alert인지 알 수 없게 됩니다.
#
#   check_id  check_target_id  check_type  module  instance
#
# SD label의 check_name, environment는 사용자가 화면에서 바꾸는 값이라 두 규칙의 식에서 뺍니다.
# Alert label에 남기면 값을 바꿀 때 Alert가 복구됐다가 새 Alert로 다시 생깁니다.
# 알림의 이름과 환경은 Manager가 Manager Database에서 채웁니다. (docs/decisions/0010)
# 바꾸는 동안 옛 series와 새 series가 함께 남아도 max가 대상마다 하나로 합칩니다.
#
# 알림 대상은 Manager Database가 정합니다.
# Telegram chat id 같은 라우팅 정보를 이 파일이나 label에 넣지 않습니다.

groups:
  - name: monitoring-check-alerts
    rules:
      - alert: MonitoringCheckDown
        expr: max without (check_name, environment) (probe_success{job="manager-blackbox"}) == 0
        for: 1m
        labels:
          severity: critical
        annotations:
          summary: "{{ $labels.instance }} 확인에 실패했습니다"
          description: "{{ $labels.instance }} 확인이 1분 넘게 실패하고 있습니다. ({{ $labels.check_type }})"

      # Blackbox Exporter가 내려갔거나 Manager API를 조회하지 못하는 상황입니다.
      - alert: MonitoringCheckProbeFailed
        expr: max without (check_name, environment) (up{job="manager-blackbox"}) == 0
        for: 1m
        labels:
          severity: critical
        annotations:
          summary: "모니터링 확인 자체가 동작하지 않습니다"
          description: "{{ $labels.instance }}의 probe 결과를 1분 넘게 가져오지 못했습니다. Blackbox Exporter 상태를 확인해 주세요."
