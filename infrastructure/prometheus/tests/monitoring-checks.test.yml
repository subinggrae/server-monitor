  # 아래 그룹은 수집 주기마다 판정 시각을 봅니다. 입력은 1초 간격이고 값 위치 n의 시각은 n초입니다.
  # '_x9'는 9초 동안 값이 없다는 뜻이라, '1 _x9 1'은 0초와 10초에 1을 넣습니다(주기 10초).
  # 두 규칙이 같은 기준을 쓰므로 probe_success와 up에 같은 값을 넣고, ALERTS로 두 Alert를 함께 봅니다.
  # Alert의 label과 annotation은 위 그룹에서 봅니다.

  # 주기 10초, 첫 실패 100초: 판정 시각은 160초입니다. 165초 평가에서 장애이고 그 직전 평가에서는 아닙니다.
