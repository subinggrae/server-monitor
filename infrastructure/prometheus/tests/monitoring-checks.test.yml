  # 성공 중에 값을 바꾸고 바로 실패(두 규칙): 옛 series의 마지막 성공 값(120초)이 5분 창 안에 남아 있어도
  # 새 series가 125~140초에 성공하고 145초부터 실패하면, 첫 실패 평가(150초)의 1분 뒤(210초) firing이어야 합니다.
  # 주소 61은 이름을, 주소 62는 주소를 바꿉니다.
  - interval: 5s
    input_series:
      - series: 'probe_success{job="manager-blackbox",check_id="6",check_target_id="61",check_type="TCP",module="tcp_connect",environment="Production",check_name="결재 TCP",instance="10.0.1.61:8080"}'
        values: '1x24 stale'
      - series: 'probe_success{job="manager-blackbox",check_id="6",check_target_id="61",check_type="TCP",module="tcp_connect",environment="Production",check_name="결재 TCP 새 이름",instance="10.0.1.61:8080"}'
        values: '_x25 1x3 0x40'
      - series: 'probe_success{job="manager-blackbox",check_id="6",check_target_id="62",check_type="TCP",module="tcp_connect",environment="Production",check_name="결재 TCP",instance="10.0.1.62:8080"}'
        values: '1x24 stale'
      - series: 'probe_success{job="manager-blackbox",check_id="6",check_target_id="62",check_type="TCP",module="tcp_connect",environment="Production",check_name="결재 TCP",instance="10.0.1.63:8080"}'
        values: '_x25 1x3 0x40'
      - series: 'up{job="manager-blackbox",check_id="6",check_target_id="61",check_type="TCP",module="tcp_connect",environment="Production",check_name="결재 TCP",instance="10.0.1.61:8080"}'
        values: '1x24 stale'
      - series: 'up{job="manager-blackbox",check_id="6",check_target_id="61",check_type="TCP",module="tcp_connect",environment="Production",check_name="결재 TCP 새 이름",instance="10.0.1.61:8080"}'
        values: '_x25 1x3 0x40'
      - series: 'up{job="manager-blackbox",check_id="6",check_target_id="62",check_type="TCP",module="tcp_connect",environment="Production",check_name="결재 TCP",instance="10.0.1.62:8080"}'
        values: '1x24 stale'
      - series: 'up{job="manager-blackbox",check_id="6",check_target_id="62",check_type="TCP",module="tcp_connect",environment="Production",check_name="결재 TCP",instance="10.0.1.63:8080"}'
        values: '_x25 1x3 0x40'
    alert_rule_test:
      - alertname: MonitoringCheckDown
        eval_time: 3m15s
        exp_alerts: []
      - alertname: MonitoringCheckDown
        eval_time: 3m30s
        exp_alerts:
          - exp_labels:
              severity: critical
              check_id: '6'
              check_target_id: '61'
            exp_annotations:
              summary: '주소 확인에 실패했습니다'
              description: '주소 확인이 1분 넘게 실패하고 있습니다.'
          - exp_labels:
              severity: critical
              check_id: '6'
              check_target_id: '62'
            exp_annotations:
              summary: '주소 확인에 실패했습니다'
              description: '주소 확인이 1분 넘게 실패하고 있습니다.'
      - alertname: MonitoringCheckProbeFailed
        eval_time: 3m15s
        exp_alerts: []
      - alertname: MonitoringCheckProbeFailed
        eval_time: 3m30s
        exp_alerts:
          - exp_labels:
              severity: critical
              check_id: '6'
              check_target_id: '61'
            exp_annotations:
              summary: '모니터링 확인 자체가 동작하지 않습니다'
              description: '확인 결과를 1분 넘게 가져오지 못했습니다. Blackbox Exporter 상태를 확인해 주세요.'
          - exp_labels:
              severity: critical
              check_id: '6'
              check_target_id: '62'
            exp_annotations:
              summary: '모니터링 확인 자체가 동작하지 않습니다'
              description: '확인 결과를 1분 넘게 가져오지 못했습니다. Blackbox Exporter 상태를 확인해 주세요.'
    promql_expr_test:
      # ALERTS_FOR_STATE의 값은 Alert가 처음 활성화된 시각(초)입니다.
      # 이 값이 그대로여야 Alertmanager에 같은 startsAt으로 이어집니다.
