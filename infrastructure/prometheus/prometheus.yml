# Prometheus 배포용 설정입니다.
#
# 사용자가 UI에서 Check를 등록해도 이 파일은 수정하지 않습니다.
# 모니터링 대상은 Manager의 HTTP Service Discovery로 관리합니다.
#
# Target 목록을 파일로 관리하지 않습니다. file_sd_configs를 쓰지 마세요.

global:
  scrape_interval: 15s
  # Manager가 허용하는 가장 짧은 수집 주기(10초)보다 길게 두지 않습니다.
  # timeout이 주기보다 길면 Prometheus가 그 대상을 수집하지 않습니다.
  scrape_timeout: 10s
  evaluation_interval: 15s

rule_files:
  - /etc/prometheus/rules/*.yml

alerting:
  alertmanagers:
    - static_configs:
        - targets:
            - alertmanager:9093

scrape_configs:

  - job_name: blackbox-exporter
    static_configs:
      - targets:
          - blackbox-exporter:9115

  # Manager의 metric은 application="monitoring-manager" label로 구분합니다.
  # 알림 대상은 Manager Database가 정하므로 여기에 routing용 label을 붙이지 않습니다.
  - job_name: manager-api
    metrics_path: /actuator/prometheus
    static_configs:
      - targets:
          - manager-api:8080

  # 사용자가 UI에서 등록한 Check입니다.
  # Target 목록은 Manager API에서 가져옵니다. 이 파일에 Target을 적지 않습니다.
  # 수집 주기도 Check마다 SD label __scrape_interval__로 받습니다. 위의 전역 scrape_interval은 쓰지 않습니다.
  - job_name: manager-blackbox
    metrics_path: /probe

    http_sd_configs:
      - url: http://manager-api:8080/api/prometheus/sd/blackbox
        refresh_interval: 15s

    relabel_configs:
      - source_labels:
          - __address__
        target_label: __param_target

      # Check Type마다 쓰는 module이 다르므로 SD label의 module을 그대로 넘깁니다.
      - source_labels:
          - module
        target_label: __param_module

      # instance에는 Blackbox 주소가 아니라 실제 대상이 남아야 합니다.
      - source_labels:
          - __param_target
        target_label: instance

      # 실제로 scrape하는 곳은 Blackbox Exporter입니다.
      - target_label: __address__
        replacement: blackbox-exporter:9115

  # 사용자가 UI에서 OS exporter(node_exporter, windows_exporter) 수집을 켠 서버입니다.
  # Target 목록은 Manager API에서 가져옵니다. 이 파일에 Target을 적지 않습니다.
  # 수집 주기도 서버마다 SD label __scrape_interval__로 받습니다. 위의 전역 scrape_interval은 쓰지 않습니다.
  # honor_labels는 기본값(false)으로 둡니다. exporter가 server_id 같은 대상 label을 바꾸지 못합니다.
  - job_name: manager-os
    metrics_path: /metrics

    http_sd_configs:
      - url: http://manager-api:8080/api/prometheus/sd/os-exporter
        refresh_interval: 30s

    # keep 뒤에 남는 series 수에 걸립니다. CPU 코어와 디스크가 아주 많은 서버만 넘습니다.
    sample_limit: 2000

    # CPU, Memory, Storage 계산(rules/server-resources.yml)에 쓰는 series만 저장합니다.
    # 다른 지표는 저장하지 않습니다. 필요해지면 이 목록과 규칙을 함께 고칩니다. (요구사항 0006)
    # CPU는 idle 카운터만 씁니다. up 같은 scrape 자체 series는 이 규칙과 관계없이 남습니다.
    metric_relabel_configs:
      - source_labels:
          - __name__
          - mode
        separator: ;
        regex: (node_cpu_seconds_total|windows_cpu_time_total);idle|(node_memory_MemTotal_bytes|node_memory_MemAvailable_bytes|node_filesystem_size_bytes|node_filesystem_avail_bytes|windows_memory_physical_total_bytes|windows_memory_available_bytes|windows_logical_disk_size_bytes|windows_logical_disk_free_bytes);.*
        action: keep
