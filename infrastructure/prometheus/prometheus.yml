# Prometheus 배포용 설정입니다.
#
# 사용자가 UI에서 Check를 등록해도 이 파일은 수정하지 않습니다. (CLAUDE.md 1번)
# 모니터링 대상은 Manager의 HTTP Service Discovery로 관리합니다.
#
# Target 목록을 파일로 관리하지 않습니다. file_sd_configs를 쓰지 마세요.

global:
  scrape_interval: 15s
  scrape_timeout: 10s
  evaluation_interval: 15s

rule_files:
  - /etc/prometheus/rules/*.yml

alerting:
  alertmanagers:
    - static_configs:
        - targets:
            - alertmanager:9093

scrape_configs:

  - job_name: blackbox-exporter
    static_configs:
      - targets:
          - blackbox-exporter:9115

  # Manager의 metric은 application="monitoring-manager" label로 구분합니다.
  # 알림 대상은 Manager Database가 정하므로 여기에 routing용 label을 붙이지 않습니다.
  - job_name: manager-api
    metrics_path: /actuator/prometheus
    static_configs:
      - targets:
          - manager-api:8080

  # 사용자가 UI에서 등록한 Check입니다.
  # Target 목록은 Manager API에서 가져옵니다. 이 파일에 Target을 적지 않습니다.
  # 수집 주기도 Check마다 SD label __scrape_interval__로 받습니다. 위의 전역 scrape_interval은 쓰지 않습니다.
  - job_name: manager-blackbox
    metrics_path: /probe

    http_sd_configs:
      - url: http://manager-api:8080/api/prometheus/sd/blackbox
        refresh_interval: 15s

    relabel_configs:
      - source_labels:
          - __address__
        target_label: __param_target

      # Check Type마다 쓰는 module이 다르므로 SD label의 module을 그대로 넘깁니다.
      - source_labels:
          - module
        target_label: __param_module

      # instance에는 Blackbox 주소가 아니라 실제 대상이 남아야 합니다.
      - source_labels:
          - __param_target
        target_label: instance

      # 실제로 scrape하는 곳은 Blackbox Exporter입니다.
      - target_label: __address__
        replacement: blackbox-exporter:9115

  # 사용자가 UI에서 SNMP를 설정한 서버입니다.
  # community는 여기에도 SD 응답에도 없습니다. exporter가 auth 이름으로 자기 config에서 찾습니다.
  # 수집 주기도 서버마다 SD label __scrape_interval__로 받습니다. 위의 전역 scrape_interval은 쓰지 않습니다.
  - job_name: manager-snmp
    metrics_path: /snmp

    http_sd_configs:
      - url: http://manager-api:8080/api/prometheus/sd/snmp
        refresh_interval: 30s

    relabel_configs:
      - source_labels:
          - __address__
        target_label: __param_target

      # 고른 Resource에 따라 필요한 module이 달라서 SD label을 그대로 넘깁니다.
      - source_labels:
          - snmp_modules
        target_label: __param_module

      - source_labels:
          - snmp_auth
        target_label: __param_auth

      # instance에는 exporter 주소가 아니라 실제 장비가 남아야 합니다.
      - source_labels:
          - __param_target
        target_label: instance

      # auth 이름은 exporter로만 넘기고 metric label로는 남기지 않습니다.
      - regex: snmp_auth|snmp_modules
        action: labeldrop

      - target_label: __address__
        replacement: snmp-exporter:9116
