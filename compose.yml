# 이 저장소의 앱(Manager API, 화면, 개발용 DB)입니다.
# 모니터링 코어(infrastructure/compose.yml)를 먼저 띄웁니다. 앱은 코어가 만든 monitoring 네트워크에 붙습니다.
#
#   core-dev.bat start      (Windows. 직접 실행하면 docker compose -f infrastructure/compose.yml up -d --build)
#
# 외부 Manager DB 사용:          docker compose up -d --build
# 로컬 개발용 MariaDB까지 사용:   docker compose --profile local-db up -d --build

services:

  manager-api:
    build:
      context: ./backend
    image: monitoring-manager-api:local
    container_name: manager-api
    restart: unless-stopped

    ports:
      - "127.0.0.1:8080:8080"

    environment:
      # 비밀번호는 여기에 넣지 않습니다. 환경변수가 config tree보다 우선해서 secret 파일을 덮어씁니다.
      SPRING_DATASOURCE_URL: ${SPRING_DATASOURCE_URL:?SPRING_DATASOURCE_URL이 필요합니다. .env.example을 참고해 주세요.}
      SPRING_DATASOURCE_USERNAME: ${SPRING_DATASOURCE_USERNAME:?SPRING_DATASOURCE_USERNAME이 필요합니다.}

      PROMETHEUS_URL: ${PROMETHEUS_URL:-http://prometheus:9090}
      GRAFANA_URL: ${GRAFANA_URL:-http://localhost:3000}

      # 비어 있으면 /register를 쓸 수 없습니다. 외부에서 접근 가능한 HTTPS 주소가 필요합니다.
      TELEGRAM_WEBHOOK_PUBLIC_URL: ${TELEGRAM_WEBHOOK_PUBLIC_URL:-}

      # 실제 운영 그룹에 테스트 메시지를 보내지 않으려고 Mock 서버로 바꿀 수 있게 둔 값입니다.
      TELEGRAM_API_BASE_URL: ${TELEGRAM_API_BASE_URL:-https://api.telegram.org}

      # Telegram 메시지에 적는 시각의 시간대입니다. DB에는 UTC로 저장합니다.
      MANAGER_TIME_ZONE: ${MANAGER_TIME_ZONE:-Asia/Seoul}

    # target이 곧 property 이름입니다. application.yml의 spring.config.import가 읽습니다.
    secrets:
      - source: manager_db_password
        target: spring.datasource.password
      - source: telegram_bot_token
        target: monitoring-manager.telegram.bot-token
      - source: telegram_webhook_secret
        target: monitoring-manager.telegram.webhook-secret
      - source: alertmanager_webhook_token
        target: monitoring-manager.notification.alertmanager-webhook-token

    # manager-db에 depends_on을 걸지 않습니다. 걸면 외부 DB를 쓸 때도 local-db profile이 함께 켜집니다.

    healthcheck:
      test: ["CMD-SHELL", "curl -fsS http://localhost:8080/actuator/health || exit 1"]
      interval: 15s
      timeout: 5s
      retries: 10
      start_period: 60s

    networks:
      - monitoring

  manager-web:
    build:
      context: ./frontend
    image: monitoring-manager-web:local
    container_name: manager-web
    restart: unless-stopped

    ports:
      - "127.0.0.1:8081:80"

    networks:
      - monitoring

  manager-db:
    image: mariadb:11.4
    container_name: manager-db
    restart: unless-stopped

    profiles:
      - local-db

    # 호스트에 이미 MariaDB나 MySQL이 떠 있으면 3306이 겹칩니다.
    ports:
      - "127.0.0.1:${MANAGER_DB_PORT:-13306}:3306"

    environment:
      MARIADB_DATABASE: ${MANAGER_DB_NAME:-monitoring_manager}
      MARIADB_USER: ${MANAGER_DB_USER:-manager}
      # manager-api도 같은 파일을 읽으므로 두 쪽 값이 어긋날 일이 없습니다.
      MARIADB_PASSWORD_FILE: /run/secrets/manager_db_password
      MARIADB_ROOT_PASSWORD_FILE: /run/secrets/manager_db_root_password

    secrets:
      - manager_db_password
      - manager_db_root_password

    healthcheck:
      test: ["CMD", "healthcheck.sh", "--connect", "--innodb_initialized"]
      interval: 10s
      timeout: 5s
      retries: 10

    volumes:
      - manager-db-data:/var/lib/mysql

    networks:
      - monitoring

  # OS exporter 수집을 개발 환경에서 확인하려고 두는 node_exporter입니다.
  #   docker compose --profile os-test up -d os-test-node-exporter
  # 운영에서는 뜨지 않습니다.
  os-test-node-exporter:
    image: quay.io/prometheus/node-exporter:v1.12.1

    container_name: os-test-node-exporter

    profiles:
      - os-test

    restart: unless-stopped

    # 컨테이너의 / 는 overlay라 기본 설정에서 빠집니다. 디스크 목록을 보려고 volume을 /data에 붙입니다.
    command:
      - --collector.filesystem.mount-points-exclude=^/(dev|proc|run/credentials/.+|sys|etc|var/lib/docker/.+)($$|/)

    volumes:
      - os-test-data:/data

    networks:
      - monitoring

# 노출되면 안 되는 값만 여기에 둡니다. 나머지 설정은 .env에 있습니다.
# 아래 파일은 Git에 올리지 않습니다. 목록과 설정 방법은 docs/DEVELOPMENT.md에 있습니다.

secrets:

  manager_db_password:
    file: ./infrastructure/secrets/manager_db_password

  manager_db_root_password:
    file: ./infrastructure/secrets/manager_db_root_password

  telegram_bot_token:
    file: ./infrastructure/secrets/telegram_bot_token

  telegram_webhook_secret:
    file: ./infrastructure/secrets/telegram_webhook_secret

  # 코어의 Alertmanager도 같은 파일을 읽습니다.
  alertmanager_webhook_token:
    file: ./infrastructure/secrets/alertmanager_webhook_token

# 코어(infrastructure/compose.yml)가 만든 네트워크입니다. 없으면 앱이 뜨지 않습니다.
networks:

  monitoring:
    name: monitoring
    external: true

volumes:

  manager-db-data:
    name: manager-db-data

  os-test-data:
    name: os-test-data
