spring:
  application:
    name: monitoring-manager

  config:
    # /run/secrets 아래 파일 하나가 property 하나가 됩니다. 파일 이름이 property 이름입니다.
    # Config tree는 아래 환경변수 fallback보다 우선합니다.
    # optional:이라 Docker 없이 띄우는 개발 환경에서는 그냥 넘어갑니다.
    import: optional:configtree:/run/secrets/

  # Manager Database 연결 정보는 여기에 적지 않습니다.
  # 제품과 위치는 운영에서 결정합니다. (CLAUDE.md 7번)

  jpa:
    open-in-view: false
    hibernate:
      # Schema는 Flyway가 관리합니다. Hibernate는 Entity가 Schema와 맞는지만 확인합니다.
      ddl-auto: validate
    properties:
      hibernate.jdbc.time_zone: UTC
      # 이 값이 없으면 Hibernate가 PostgreSQL에서 timestamptz를 기대해서
      # MariaDB와 PostgreSQL의 Migration을 똑같이 맞출 수 없습니다.
      hibernate.timezone.default_storage: NORMALIZE_UTC

  flyway:
    enabled: true
    # {vendor}는 JDBC URL을 보고 mariadb 또는 postgresql로 바뀝니다.
    locations: classpath:db/migration/{vendor}
    # 지원하지 않는 제품을 연결하면 조용히 넘어가지 않고 실패하게 합니다.
    fail-on-missing-locations: true

  mvc:
    problemdetails:
      enabled: true

  threads:
    virtual:
      enabled: true

server:
  port: 8080
  shutdown: graceful
  error:
    # 예외 내용이 API 응답으로 새어 나가지 않게 합니다.
    include-message: never
    include-stacktrace: never

management:
  endpoints:
    web:
      exposure:
        # 플랫폼에 필요한 endpoint만 엽니다.
        include: health,info,prometheus
  endpoint:
    health:
      show-details: when-authorized
      probes:
        enabled: true
  prometheus:
    metrics:
      export:
        # Spring Boot 4부터 기본으로 꺼져 있습니다. 켜야 /actuator/prometheus가 열립니다.
        enabled: true
  metrics:
    tags:
      application: ${spring.application.name}

# 아래 환경변수는 Docker Secret이 없을 때 쓰는 개발용 fallback입니다.
monitoring-manager:
  prometheus:
    base-url: ${PROMETHEUS_URL:http://prometheus:9090}
  grafana:
    base-url: ${GRAFANA_URL:http://grafana:3000}
  telegram:
    bot-token: ${TELEGRAM_BOT_TOKEN:}
    api-base-url: ${TELEGRAM_API_BASE_URL:https://api.telegram.org}
    webhook-secret: ${TELEGRAM_WEBHOOK_SECRET:}
    # 비어 있으면 /register를 쓸 수 없습니다. 그때는 Chat ID를 직접 등록합니다.
    webhook-public-url: ${TELEGRAM_WEBHOOK_PUBLIC_URL:}
    timeout: ${TELEGRAM_TIMEOUT:5s}

  notification:
    # 복구 알림을 Alertmanager가 곧바로 다시 보낼 때 한 번만 보내도록 막는 창입니다.
    # 이어지는 Alert의 재발송은 Check별 재발송 주기(Manager Database)가 정합니다.
    dedupe-window: ${NOTIFICATION_DEDUPE_WINDOW:2m}
    # DB에는 UTC로 저장합니다. 이 값은 Telegram 메시지에만 씁니다.
    display-time-zone: ${MANAGER_TIME_ZONE:Asia/Seoul}
    alertmanager-webhook-token: ${ALERTMANAGER_WEBHOOK_TOKEN:}

logging:
  level:
    kr.co.unidocs.monitoring: INFO
